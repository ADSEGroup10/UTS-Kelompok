spring.application.name=hello-bpmn

# Output bersih: tanpa banner dan hanya log ERROR
spring.main.banner-mode=off
logging.level.root=ERROR

# Database H2 in-memory (data hilang saat aplikasi berhenti)
spring.datasource.url=jdbc:h2:mem:hellobpmn;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flowable membuat tabel otomatis; async executor tidak diperlukan untuk hello world
flowable.database-schema-update=true
flowable.async-executor-activate=false
