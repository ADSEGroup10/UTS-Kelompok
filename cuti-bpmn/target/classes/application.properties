spring.application.name=cuti-bpmn
server.port=8080

# Database H2 in-memory (data hilang saat aplikasi berhenti)
spring.datasource.url=jdbc:h2:mem:cutibpmn;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Flowable
flowable.database-schema-update=true
# full = variabel proses tersimpan di riwayat, dipakai untuk menampilkan hasil akhir
flowable.history-level=full

# Demo credentials. Override these values outside source control for a deployment.
app.security.karyawan.username=budi
app.security.karyawan.password=budi123
app.security.atasan.username=atasan
app.security.atasan.password=atasan123
